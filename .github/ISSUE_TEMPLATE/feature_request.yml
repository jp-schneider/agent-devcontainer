name: Feature request
description: A new variant, toolchain, overlay, protection, or a usability improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If it touches the hardening, say which privileges or mounts it would need.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
