
# Stack-agnostic, hardened core. Variants layer overlays on top of this file
# via the dockerComposeFile array in their devcontainer.json; this file must
# stay first in that array, because compose resolves the project directory
# (and with it the auto-loaded .env written by initialize.sh) from the first file.

# Pinned project name: without it the devcontainer CLI derives it from the first
# compose file's directory ("shared"), so every project built from this template
# would share one compose project and recreate each other's containers.
# PROJECT_SLUG reproduces the CLI's old default "<workspace>_devcontainer".
name: ${PROJECT_SLUG:-project}_devcontainer

services:
  claude-code:
    hostname: ${WORKTREE_NAME:-project}-devcontainer
    build:
      # Whole .devcontainer/ (project apt lists, .generated/); .dockerignore keeps the rest out
      context: ${LOCAL_WORKSPACE_FOLDER}/.devcontainer
      dockerfile: shared/Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
        # The variant's toolchains, in order (initialize.sh <variant> <toolchain>...)
        TOOLCHAINS: ${TOOLCHAINS:-}
    container_name: claude-code-${WORKTREE_NAME:-project}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # Mount the workspace folder into the container at /app, using cached mode for performance
      - ${LOCAL_WORKSPACE_FOLDER}:/app:cached
      # Worktree and submodule support — mount the common gitdir at the same absolute path inside the container
      - ${GIT_COMMON_DIR}:${GIT_COMMON_DIR}:cached
      - ${LOCAL_WORKSPACE_FOLDER}/.claude-docker/.claude.json:/home/vscode/.claude.json
      - ${LOCAL_WORKSPACE_FOLDER}/.claude-docker/.bash_history:/home/vscode/.bash_history
      - claude-config:/home/vscode/.claude
    environment:
      # Required for HMR file watching in WSL/Docker
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # Read by shared/post-start.sh to run each toolchain's post-start.sh
      DEVCONTAINER_TOOLCHAINS: ${TOOLCHAINS:-}
    env_file:
      # container.env, not .env: .env is host-only and masked in the container (protect-paths.sh)
      - ${LOCAL_WORKSPACE_FOLDER}/container.env
      # shared/.env (host paths, UID/GID) is only for compose interpolation, not passed in;
      # overlays pass the variables the container needs explicitly (e.g. toolchains/uv)
    networks:
      - dev
    command: >
      bash -c '
      (for i in $$(seq 1 10); do sleep 30;
        find /tmp -maxdepth 2 \( -name "vscode-ipc-*.sock" -o -name "vscode-git-*.sock" \) -delete 2>/dev/null;
      done) &
      sleep infinity'

networks:
  dev:
    name: ${WORKTREE_NAME:-project}-dev
    driver: bridge

volumes:
  claude-config:
    name: claude-code-${WORKTREE_NAME:-project}-config
